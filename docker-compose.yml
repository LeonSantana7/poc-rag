services:

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: ./backend
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -u ingest.py
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./frontend:/frontend
    env_file:
      - .env
    depends_on:
      ingest:
        condition: service_completed_successfully

volumes:
  pgdata:
